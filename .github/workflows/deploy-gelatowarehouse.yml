# Publishes sites/gelatowarehouse to GitHub Pages.
# Runs automatically whenever a change to that folder lands on main,
# and can be run by hand from the repo's Actions tab.
name: Deploy gelatowarehouse.com

on:
  push:
    branches: [main]
    paths:
      - "sites/gelatowarehouse/**"
      - ".github/workflows/deploy-gelatowarehouse.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Cache-busting: add "?v=<commit>" to the CSS/JS links in the published
      # copy, so visitors' browsers fetch the new files after every update
      # instead of reusing old cached ones. Source files are left untouched.
      - name: Version CSS and JS links
        run: |
          v="${GITHUB_SHA::7}"
          find sites/gelatowarehouse -name '*.html' -exec \
            sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+\.(css|js))\"#\1=\"\2?v=${v}\"#g" {} +
          grep -ho '\(href\|src\)="\(css\|js\)/[^"]*"' sites/gelatowarehouse/*.html | sort -u
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/gelatowarehouse
      - id: deployment
        uses: actions/deploy-pages@v4
