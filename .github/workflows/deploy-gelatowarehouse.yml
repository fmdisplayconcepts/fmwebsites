# Publishes sites/gelatowarehouse to GitHub Pages.
# Runs automatically whenever a change to that folder lands on main,
# and can be run by hand from the repo's Actions tab.
name: Deploy gelatowarehouse.com

on:
  push:
    branches: [main]
    paths:
      - "sites/gelatowarehouse/**"
      - ".github/workflows/deploy-gelatowarehouse.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/gelatowarehouse
      - id: deployment
        uses: actions/deploy-pages@v4
