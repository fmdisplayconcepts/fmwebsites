<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | FM Display Concepts</title>
  <meta name="description" content="Get in touch with FM Display Concepts.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">FM Display Concepts</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h1>Contact us</h1>
        <p>Placeholder: phone, email and address go here.</p>
      </div>
    </section>

    <section class="section section-muted">
      <div class="container">
        <h2>Send us a message</h2>
        <!-- TODO: point "action" at a form service (e.g. Formspree, Netlify Forms) once hosting is chosen. -->
        <form class="form" action="#" method="post">
          <label>Name <input type="text" name="name" required></label>
          <label>Email <input type="email" name="email" required></label>
          <label>Message <textarea name="message" rows="5" required></textarea></label>
          <button class="button" type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span data-year></span> FM Display Concepts</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
